[package]
name = "urbilateria"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
description = "A small, educational pure-Rust multi-model inference and analysis framework"
license = "MIT"
repository = "https://github.com/inspirewind/Urbilateria"
readme = "README.md"

[lib]
name = "urbilateria"
path = "src/lib.rs"

[[bin]]
name = "urb"
path = "src/main.rs"

[features]
default = ["ui"]
ui = ["dep:crossterm", "dep:ratatui", "dep:ratatui-textarea", "dep:shlex", "dep:signal-hook"]

[dependencies]
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"], optional = true }
ratatui-textarea = { version = "0.9.2", default-features = false, features = ["crossterm"], optional = true }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = { version = "1.3", optional = true }
unicode-general-category = "1.1"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
