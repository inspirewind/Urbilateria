name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.83
        run: |
          rustup toolchain install 1.83.0 \
            --profile minimal \
            --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.83.0 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.83.0 clippy --locked --all-targets -- -D warnings

  tests:
    name: Tests (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.83.0
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal

      - name: Run all model-free tests
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets

  release-smoke:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.83
        run: rustup toolchain install 1.83.0 --profile minimal

      - name: Build release binary
        run: cargo +1.83.0 build --release --locked --bin urb

      - name: Smoke-test CLI
        run: ./target/release/urb help
